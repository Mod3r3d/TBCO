name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore TranslateBot.sln -r win-x64

      - name: Run Unit Tests
        run: dotnet test TranslateBot.Tests/TranslateBot.Tests.csproj -c Release --verbosity normal

      - name: Build and Package Release (TBCO.exe & TBCO-win-x64.zip)
        shell: pwsh
        run: |
          ./build-release.ps1

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/TBCO-win-x64.zip
          name: "TBCO ${{ github.ref_name }} - Game Profiles, Safe Translation Memory & Evaluation Harness"
          body: |
            ### 🎮 TBCO — Phiên Bản Dựng Sẵn (Đã đóng gói hoàn chỉnh)
            
            > 🟢 **Tải về:** Tải file **`TBCO-win-x64.zip`** ở mục **Assets** bên dưới.  
            > ⚠️ **Lưu ý:** KHÔNG tải file `Source code (zip)` vì đó chỉ là mã nguồn lập trình, không có file chạy `.exe`.
            
            #### ✨ Điểm mới trong bản cập nhật này:
            - **Hệ thống Hồ sơ Game (Game Profiles) & Phân cảnh (Scene Switching):** Tự động nhận diện cửa sổ game (Fate/Grand Order JP/NA, Blue Archive, Visual Novel Generic), đồng bộ vùng quét OCR, hồ sơ nhân vật và từ điển game ngữ cảnh.
            - **Bộ nhớ bản dịch an toàn 2.0 (Context-Aware Translation Memory):** Schema v2 với CacheKey phân tách theo Game Profile và cặp ngôn ngữ; bảo vệ tuyệt đối bản dịch người dùng duyệt (`UserApproved`); tự động chặn bản dịch fallback kém chất lượng khỏi canonical cache.
            - **Đánh giá chất lượng tự động (Translation Quality Harness & OCR Benchmark):** Tích hợp bộ đo lường độc lập cho thuật ngữ, văn phong, CER/WER và độ trễ engine OCR.
            - **Chuẩn hóa văn phong Vietsub Anime/VN cao cấp:** Nhất quán cặp xưng hô "ta - cậu" hoặc "tôi - cậu", bảo toàn danh xưng đặc thù (Master, Senpai, sư phụ - đồ nhi).
            - **Giao diện tinh gọn:** Đã loại bỏ nhãn "PRO", tối ưu trải nghiệm đọc thoại trực quan và sắc nét trên mọi tỷ lệ màn hình (14" đến 4K, HiDPI).
            - **Chất lượng mã nguồn:** Toàn bộ 177/177 bài kiểm thử (Unit & Integration Tests) vượt qua thành công 100%.

            #### 📂 Hướng dẫn khởi chạy nhanh:
            1. Tải và giải nén file `TBCO-win-x64.zip`.
            2. Mở thư mục `TBCO-win-x64`, nhấp đúp vào **`TBCO.exe`** (hoặc `KHOI_CHAY_TBCO.bat`).
            3. Nhấn **Ctrl+K** vào **[Cài đặt & API]** để cấu hình API Key Gemini hoặc chọn DeepL / Google Web Translate miễn phí.
            4. Bấm **F1** để xem bảng tra cứu phím tắt bất kỳ lúc nào!
          draft: false
          prerelease: false

      - name: Upload Artifacts (for manual workflow runs)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: TBCO-Windows-x64
          path: release/TBCO-win-x64.zip
          retention-days: 14
