name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore TranslateBot.sln -r win-x64

      - name: Run Unit Tests
        run: dotnet test TranslateBot.Tests/TranslateBot.Tests.csproj -c Release --verbosity normal

      - name: Build and Package Release (TBCO.exe & TBCO-win-x64.zip)
        shell: pwsh
        run: |
          ./build-release.ps1

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/TBCO-win-x64.zip
          name: "TBCO ${{ github.ref_name }} - Bounded Queue, Generation Safety, Multi-Key Pool & Enhanced Reliability"
          body: |
            ### 🎮 TBCO — Phiên Bản Dựng Sẵn (Đã đóng gói hoàn chỉnh)
            
            > 🟢 **Tải về:** Tải file **`TBCO-win-x64.zip`** ở mục **Assets** bên dưới.  
            > ⚠️ **Lưu ý:** KHÔNG tải file `Source code (zip)` vì đó chỉ là mã nguồn lập trình, không có file chạy `.exe`.
            
            #### ✨ Điểm mới trong bản cập nhật v3.1.0:
            - **Hàng đợi dịch có giới hạn & Chống tràn RAM (Bounded Queue & Backpressure):** Chuyển sang hàng đợi Bounded Channel (sức chứa 32 slots), ưu tiên xử lý thoại Confirmed trước Prefetch, tự động loại bỏ prefetch cũ khi hàng đợi đầy.
            - **An toàn thứ tự & Vòng đời phiên (ReorderBuffer & Generation Safety):** Gọi callback ngoài lock chống deadlock UI, gắn cờ `GenerationId` giúp loại bỏ hoàn toàn các phụ đề trễ từ vùng quét hoặc cửa sổ trước đó.
            - **Xoay vòng đa khóa API toàn diện (Multi-Key ApiKeyPool Rotation):** Tự động duyệt qua toàn bộ danh sách key khả dụng trong pool theo ngân sách yêu cầu, phân loại chính xác mã lỗi 429 Quota/Rate Limit và dừng ngay lập tức khi hủy tác vụ.
            - **Hỗ trợ đa màn hình & Toạ độ âm (VirtualScreen & DPI Support):** Mở rộng khả năng chụp trên mọi màn hình phụ (kể cả đặt bên trái/phía trên màn chính), kiểm tra tính hợp lệ của cửa sổ game và ngăn ngừa lỗi toạ độ.
            - **Bộ ghi log bất đồng bộ & LocalAppData (Async Rolling Logger):** Ghi log nền qua Channel không nghẽn disk, xoay vòng file log tự động tại `%LOCALAPPDATA%\TBCO\logs`.
            - **Quản lý HttpClient dùng chung (SharedHttpClient):** Sử dụng `SocketsHttpHandler` dùng chung cho toàn bộ provider AI, ngăn chặn rò rỉ socket và kết nối TCP.
            - **Duy trì lịch sử thoại khi đổi cấu hình (Session Continuity):** Tự động khôi phục và tiếp tục phiên làm việc thay vì xóa sạch danh sách thoại khi engine khởi động lại.
            - **Chất lượng mã nguồn tuyệt đối:** 195/195 bài kiểm thử tự động (Unit & Integration Tests) vượt qua thành công 100%.

            #### 📂 Hướng dẫn khởi chạy nhanh:
            1. Tải và giải nén file `TBCO-win-x64.zip`.
            2. Mở thư mục `TBCO-win-x64`, nhấp đúp vào **`TBCO.exe`** (hoặc `KHOI_CHAY_TBCO.bat`).
            3. Nhấn **Ctrl+K** vào **[Cài đặt & API]** để cấu hình API Key Gemini hoặc chọn DeepL / Google Web Translate miễn phí.
            4. Bấm **F1** để xem bảng tra cứu phím tắt bất kỳ lúc nào!
          draft: false
          prerelease: false

      - name: Upload Artifacts (for manual workflow runs)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: TBCO-Windows-x64
          path: release/TBCO-win-x64.zip
          retention-days: 14
