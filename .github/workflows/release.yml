name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore TranslateBot.sln -r win-x64

      - name: Run Unit Tests
        run: dotnet test TranslateBot.Tests/TranslateBot.Tests.csproj -c Release --verbosity normal

      - name: Build and Package Release (TBCO.exe & TBCO-win-x64.zip)
        shell: pwsh
        run: |
          ./build-release.ps1

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/TBCO-win-x64.zip
          name: "TBCO ${{ github.ref_name }} PRO - Persistent Settings, OCR Sync & Uncluttered Subtitles"
          body: |
            ### 🎮 TBCO — Phiên Bản Dựng Sẵn (Đã đóng gói hoàn chỉnh)
            
            > 🟢 **Tải về:** Tải file **`TBCO-win-x64.zip`** ở mục **Assets** bên dưới.  
            > ⚠️ **Lưu ý:** KHÔNG tải file `Source code (zip)` vì đó chỉ là mã nguồn lập trình, không có file chạy `.exe`.
            
            #### ✨ Điểm mới trong bản cập nhật này:
            - **Tự động lưu API Key & Thiết lập:** Mọi thay đổi về API Key (thêm, xóa, bật/tắt, dán nhanh) và cấu hình ứng dụng được tự động lưu tức thì và mã hóa DPAPI an toàn, hoàn toàn không bị mất hay reset khi đóng app.
            - **Đồng bộ phím tắt Ctrl+F8 với Quản lý Vùng OCR:** Khi kéo chọn vùng quét nhanh bằng `Ctrl + F8`, vùng thoại lập tức được ghi nhận và lưu đồng bộ vào danh sách Quản lý Vùng OCR.
            - **Phụ đề gọn gàng, không che vướng:** Hỗ trợ ẩn nhãn tên người nói trên thanh phụ đề nổi và cửa sổ phụ đề độc lập (mặc định tắt để giao diện thoáng sạch), đồng thời loại bỏ tiền tố tên người nói khỏi câu dịch.
            - **Nhất quán đại từ xưng hô Anime/VN:** Cải tiến cơ chế nhận diện ngữ cảnh và đại từ xưng hô nhân vật (ta - cậu, tôi - cậu, Master, Senpai...).
            - **Chất lượng mã nguồn:** Toàn bộ 142/142 bài kiểm thử (Unit Tests) vượt qua thành công.

            #### 📂 Hướng dẫn khởi chạy nhanh:
            1. Tải và giải nén file `TBCO-win-x64.zip`.
            2. Mở thư mục `TBCO-win-x64`, nhấp đúp vào **`TBCO.exe`** (hoặc `KHOI_CHAY_TBCO.bat`).
            3. Nhấn **Ctrl+K** vào **[Cài đặt & API]** để cấu hình API Key Gemini hoặc chọn DeepL / Google Web Translate miễn phí.
            4. Bấm **F1** để xem bảng tra cứu phím tắt bất kỳ lúc nào!
          draft: false
          prerelease: false

      - name: Upload Artifacts (for manual workflow runs)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: TBCO-Windows-x64
          path: release/TBCO-win-x64.zip
          retention-days: 14
