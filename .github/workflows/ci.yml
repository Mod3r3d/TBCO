name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore TranslateBot.sln -r win-x64

      - name: Build Solution (Release)
        run: dotnet build TranslateBot.sln -c Release

      - name: Run All Automated Tests
        run: dotnet test TranslateBot.Tests/TranslateBot.Tests.csproj -c Release --verbosity normal --logger "trx;LogFileName=test_results.trx"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TranslateBot.Tests/TestResults/test_results.trx
